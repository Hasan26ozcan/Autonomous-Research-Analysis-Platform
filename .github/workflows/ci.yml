name: CI

# Single consolidated pipeline that runs on every push to main and on every
# PR targeting main. Quality gates:
#   * unit-tests  -> REQUIRED by branch protection (must stay green)
#   * lint        -> Ruff (informational for now; promote to required later)
#   * type-check  -> mypy (informational for now)
#   * security    -> pip-audit dependency scan (informational for now)
#   * pre-commit  -> runs the same hooks as the local git hook (safety net)
#
# The informational jobs use `continue-on-error: true` so a finding never
# blocks a merge or turns main red, while still surfacing the report. Once
# the codebase is clean they can be promoted to required checks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests & coverage
    runs-on: ubuntu-latest

    env:
      # Dummy values so module-level clients (ChatOpenAI, etc.) can be
      # instantiated at import time. Unit tests mock all external calls,
      # so no real credentials are needed to run this suite.
      OPENAI_API_KEY: "sk-test-dummy-key-for-ci"
      NEO4J_PASSWORD: "test-password"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit -v \
            --cov=app --cov-report=term-missing \
            --cov-report=xml --cov-report=html

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/

      - name: Upload coverage to Codecov
        # Public repo: no token required. For a private repo, add a
        # CODECOV_TOKEN secret in Settings -> Secrets and reference it here.
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    # Pinned to match the ruff-pre-commit hook revision for consistent rules.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff==0.6.9

      - name: Run Ruff
        run: ruff check .

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies + mypy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Run mypy
        run: mypy app

  security:
    name: Dependency security (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt --desc on

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
