name: CI

# Single consolidated pipeline that runs on every push to main and on every
# PR targeting main. Quality gates:
#   * unit-tests  -> REQUIRED by branch protection (must stay green)
#   * lint        -> Ruff (informational for now; promote to required later)
#   * type-check  -> mypy (informational for now)
#   * security    -> pip-audit dependency scan (informational for now)
#   * pre-commit  -> runs the same hooks as the local git hook (safety net)
#
# The informational jobs use `continue-on-error: true` so a finding never
# blocks a merge or turns main red, while still surfacing the report. Once
# the codebase is clean they can be promoted to required checks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests & coverage
    runs-on: ubuntu-latest

    env:
      # Dummy values so module-level clients (ChatOpenAI, etc.) can be
      # instantiated at import time. Unit tests mock all external calls,
      # so no real credentials are needed to run this suite.
      OPENAI_API_KEY: "sk-test-dummy-key-for-ci"
      NEO4J_PASSWORD: "test-password"

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit -v \
            --cov=app --cov-report=term-missing \
            --cov-report=xml --cov-report=html

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-html
          path: htmlcov/

      - name: Upload coverage to Codecov
        # CODECOV_TOKEN is a repository secret holding the Codecov upload
        # token (Settings -> Secrets and variables -> Actions). It is NOT
        # hardcoded here. Generated per-repo on the Codecov setup page.
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          # Tags this upload as the unit-test suite; matches the `unittests`
          # flag declared in codecov.yml (carryforward enabled there).
          flags: unittests
          fail_ci_if_error: false

  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    # Pinned to match the ruff-pre-commit hook revision for consistent rules.
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff==0.6.9

      - name: Run Ruff
        run: ruff check .

  type-check:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies + mypy
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Run mypy
        run: mypy app

  security:
    name: Dependency security (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt --desc on

  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
