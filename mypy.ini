# mypy — static type checker.
# This is a deliberately lenient starting configuration: it validates the
# type hints that are already present in the code without requiring every
# function to be annotated or following into third-party untyped modules
# (LangChain, sentence-transformers, etc.), which would produce a wall of
# noise. Tighten (disallow_untyped_defs, stricter follow_imports, per-module
# overrides) in a later pass once the codebase is cleaner.

[mypy]
python_version = 3.11
warn_unused_configs = True
show_error_codes = True

# Treat missing/incomplete third-party stubs gracefully instead of erroring.
ignore_missing_imports = True
follow_imports = silent

# Be lenient for now (strictness can be increased later).
disallow_untyped_defs = False
check_untyped_defs = False
warn_unused_ignores = False

# Don't type-check tests, docs, caches, or model weights.
exclude = (?x)(tests/|docs/|\.venv/|hf_cache/|evaluation/)

[mypy.tests.*]
ignore_errors = True
